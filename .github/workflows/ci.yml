name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Without --all: that flag also formats path dependencies, including the vendored crate.
      - run: cargo fmt --check

  clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # --all-features enables old-spec-fixtures, whose tests include_str! test-suite files.
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      # Shared with the test job: both compile the same debug artifacts.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-test
      - run: cargo build --workspace --all-targets --locked

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BTCR2_REQUIRE_TEST_SUITE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: build-test
      - run: cargo test --workspace --locked

  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: cargo doc --workspace --no-deps --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The declared rust-version overrides rust-toolchain.toml for every later step.
      - name: Select the rust-version toolchain
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          test -n "$msrv"
          echo "RUSTUP_TOOLCHAIN=$msrv" >> "$GITHUB_ENV"
      - run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Library and binary targets only: dev-dependencies may need a newer compiler.
      - run: cargo check --workspace --locked

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - run: cargo deny --locked --workspace check bans licenses sources

  # Advisories gate a change to the dependency graph or the policy. paths-filter keeps its
  # default base: a pull request is compared with its target branch, a push to main with the
  # commit before the push, and a push to any other branch with its merge-base with main. So
  # on a branch whose manifests differ from main the check runs on every push. That is
  # deliberate: the scheduled scan only covers main, so this is such a branch's only advisory
  # coverage until it merges. A red push run blocks nothing; required checks bind only on
  # pull requests into main. On main, a new advisory against an already-locked crate
  # surfaces through the scheduled scan instead. The job always runs (and passes when
  # nothing relevant changed) so it can be a required check.
  deny-advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ""
          filters: |
            manifests:
              - 'Cargo.lock'
              - '**/Cargo.toml'
              - 'deny.toml'
      - if: steps.changes.outputs.manifests == 'true'
        run: rustup toolchain install
      - if: steps.changes.outputs.manifests == 'true'
        uses: taiki-e/install-action@83ac0ad63c0167e6f06796fab0fce28db1bf3db0 # v2.87.22
        with:
          tool: cargo-deny@0.20.2
          fallback: none
      - if: steps.changes.outputs.manifests == 'true'
        run: cargo deny --locked --workspace check advisories

  # Lints and tests the shell scripts the workflows call.
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck .github/scripts/*.sh
      - run: bash .github/scripts/test-advisory-issue.sh
