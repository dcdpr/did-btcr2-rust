[package]
name = "did-btcr2"
version = "0.1.0"
edition = "2024"
license = "MPL-2.0"
description = "Implementation of DID:BTCR2"
repository = "https://github.com/dcdpr/did-btcr2.git"
authors = ["Dan Pape <dpape@dpape.com>", "Jay Oster <jay@blipjoy.com>"]
keywords = ["did", "did-btcr2", "decentralized"]
categories = ["cryptography::cryptocurrencies", "authentication", "encoding"]
readme = "README.md"
documentation = "https://docs.rs/did-btcr2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
nonempty = { version = "0.12", default-features = false }
onlyerror = "0.1"
rand = "0.8"

# JSON processing
json-patch = "4"
serde = { version = "1", features = ["derive"] }
serde_jcs = "0.1"
serde_json = "1"
base64 = "0.22"

# Cryptography
base58 = "0.2"
multibase = "0.9"
secp256k1 = { version = "0.27", features = ["rand"] }
sha2 = "0.10"

# Bitcoin
bech32-rust = { version = "0.1.0", git = "ssh://git@gl1.dcdpr.com/dcd/bech32-rust.git" }
esploda = "0.2"

# ZCAP
urlencoding = "2"

[dev-dependencies]
# Test-only re-declaration of `bitcoin` (already brought transitively by
# `esploda` 0.2) with the `bitcoinconsensus` feature enabled. This wires the
# full-script `Script::verify` oracle used by the announce-signing tests
# WITHOUT changing the published crate's feature surface. `esploda` 0.2
# does NOT re-expose a `bitcoin/bitcoinconsensus` passthrough feature, so this
# direct dev-dependency is the supported path; it resolves to the same
# bitcoin 0.30.2 lock entry as `esploda::bitcoin`.
bitcoin = { version = "0.30", features = ["bitcoinconsensus"] }

[features]
# Gates the legacy Base58-encoded test-suite fixtures (e.g. test_traversal in
# resolver.rs) so CI can stay green after the hash-encoding switch
# encoding to base64url-no-pad. Off by default; enabled only when running the
# pre-rename fixtures.
old-spec-fixtures = []

[workspace]
members = [
    "crates/*",
]
